<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Relay Control</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<div class="app">

    <header>
        <h1>4 Relay Control</h1>
        <p>Firebase IoT Control Panel</p>

        <div id="connection" class="connection">
            Connecting...
        </div>
    </header>

    <main class="relay-container">

        <div class="relay-card">
            <div class="relay-icon">⚡</div>
            <h2>Relay 1</h2>
            <div id="status1" class="status off">OFF</div>
            <button id="button1" onclick="toggleRelay(1)">
                Turn ON
            </button>
        </div>

        <div class="relay-card">
            <div class="relay-icon">⚡</div>
            <h2>Relay 2</h2>
            <div id="status2" class="status off">OFF</div>
            <button id="button2" onclick="toggleRelay(2)">
                Turn ON
            </button>
        </div>

        <div class="relay-card">
            <div class="relay-icon">⚡</div>
            <h2>Relay 3</h2>
            <div id="status3" class="status off">OFF</div>
            <button id="button3" onclick="toggleRelay(3)">
                Turn ON
            </button>
        </div>

        <div class="relay-card">
            <div class="relay-icon">⚡</div>
            <h2>Relay 4</h2>
            <div id="status4" class="status off">OFF</div>
            <button id="button4" onclick="toggleRelay(4)">
                Turn ON
            </button>
        </div>

    </main>

    <footer>
        <p>Firebase 4-Channel Relay Controller</p>
    </footer>

</div>

<script type="module" src="script.js"></script>

</body> </html>
